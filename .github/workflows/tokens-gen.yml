# 來源:UI_DEPLOY/.metaui/UI_KIT/templates/tokens-gen.workflow.yml
# 安裝:2026-09-09(含模組層生成器;範本屬 v1.7 素材,本檔先行)
#
# 用途:生成物過期時由 CI 重產並寫回同一個 PR。
# 射程=五支生成器:tokens/vuetify_theme/design_md(專案層)+ copy/digest(逐 F 模組)。
# 不含 gen_flowmap(需 headless Edge,CI 無)。
# 檔名沿用 tokens-gen 是為免四案再改名一輪,實際射程如上。
# 案源:2026-09-07 週會裁「設計師更新樣式之後請 AI 產檔」,但未定產檔在哪跑;
#       2026-09-09 拍板者裁「CI 產檔」——設計師與前端都不裝 Python。
#
# 與 checks.yml 的分工:
#   checks.yml  = 驗(run_checks --gate all,含 UIV-06 生成物新鮮度)
#   本檔        = 產(三支生成器寫入模式)+ 產完自驗
# 兩者不重疊。本檔產完自己跑一次 run_checks,是因為 checks.yml 不保證會對
# 「寫回後的樹」重跑——實測(moa-weather PR#163,2026-09-09):bot 推的 commit
# 上兩支 workflow 皆為 action_required(候批准),不會自動跑完。
# 故本檔之自驗是該 PR 唯一對最終樹的機械驗證,不可省。
#
# 迴圈保護=生成器之決定性,不依賴觸發行為:寫回後再跑必無差異,故不成環。
# (原註稱「GITHUB_TOKEN 之推送不觸發 workflow」,實測不成立——run 有被建立,
#  只是停在候批准。迴圈保護不繫於該假設。)

name: tokens-gen

on:
  pull_request:
    paths:
      # 值改了
      - 'DesignSpecs/UIFoundation/tokens.json'
      # 生成器改了——同一份 tokens.json 也會產出不同結果,生成物一樣會過期。
      # 2026-09-09 補:原僅列 tokens.json,換包帶進新版生成器時觸發不到,
      # UIV-06 會紅而沒有任何東西去修它。實例=v1.6 之深色 alias 修法,
      # moa-weather 同一份 tokens.json 深色區塊增 8 鍵。
      - '.metaui/UI_KIT/checks/**'
      # 頁面改了——gen_copy 讀頁面,00_CopySheet.md 會過期。
      - 'DesignSpecs/**/ui/pages/**'

permissions:
  contents: write

jobs:
  generate:
    # fork 來的 PR 推不回去,略過;此類 PR 仍由 checks.yml 的 UIV-06 擋下,不會漏。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 前置check(缺件即略過,不當失敗)
        id: pre
        run: |
          if [ ! -f DesignSpecs/UIFoundation/tokens.json ]; then
            echo "tokens.json 未就位——本案不消費 token 管線,略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ ! -d .metaui/UI_KIT/checks ]; then
            echo ".metaui/UI_KIT/checks 未就位——UI 包未部署,略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 產檔(三支生成器,寫入模式)
        if: steps.pre.outputs.skip == 'false'
        run: |
          python .metaui/UI_KIT/checks/gen_tokens.py        --project .
          python .metaui/UI_KIT/checks/gen_vuetify_theme.py --project .
          python .metaui/UI_KIT/checks/gen_design_md.py     --project .

      - name: 產檔(模組層:文案清單與導讀)
        if: steps.pre.outputs.skip == 'false'
        run: |
          # gen_copy / gen_digest 為逐 F 模組,CLI 是 --scope <模組目錄> 而非 --project。
          # gen_flowmap 不納:它需要 headless Edge 產縮圖,CI 環境沒有。
          # 個別模組失敗不中斷——缺 SA 輸入之模組本就產不出導讀;
          # 真正的把關是最後那步自驗,過期就會紅,不會靜靜放過。
          find DesignSpecs -type d -name ui -not -path '*/UIFoundation/*' | while read -r d; do
            m="$(dirname "$d")"
            python .metaui/UI_KIT/checks/gen_copy.py   --scope "$m" || echo "  gen_copy 略過: $m"
            python .metaui/UI_KIT/checks/gen_digest.py --scope "$m" || echo "  gen_digest 略過: $m"
          done

      - name: 有差異就寫回同一個 PR
        if: steps.pre.outputs.skip == 'false'
        run: |
          git config user.name  "metaui-gen"
          git config user.email "metaui-gen@users.noreply.github.com"
          git add -- \
            DesignSpecs/UIFoundation/tokens.css \
            DesignSpecs/UIFoundation/00_TokenSheet.md \
            DesignSpecs/UIFoundation/vuetify.theme.json \
            DesignSpecs/UIFoundation/Design.md
          find DesignSpecs -type f \( -name 00_CopySheet.md -o -name 00_Digest.md \) \
            -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "生成物已是最新,無須寫回"
          else
            git commit -m "chore(tokens): CI 重生成生成物(tokens.css/00_TokenSheet.md/vuetify.theme.json/Design.md)"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: 產完自驗(寫回後的樹)
        if: steps.pre.outputs.skip == 'false'
        run: |
          python .metaui/UI_KIT/checks/run_checks.py --gate all --scope . --format text
